services:
  - type: web
    name: arfa-bragi-brewery
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed.py
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: SHOP_URL
        value: https://arfabragi.ru
      - key: ADMIN_PASSWORD
        value: skald_secret_2026
