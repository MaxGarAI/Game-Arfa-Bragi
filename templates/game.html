{% extends 'base.html' %}

{% block title %}Игра «Арфа Браги» — Ритм-кликер крафтовой пивоварни{% endblock %}

{% block content %}
<section class="section" style="text-align: center; padding: 5rem 1rem;">
  <div class="container" style="max-width: 500px;">
    <img src="{{ url_for('static', filename=logos.main_logo) }}" alt="{{ brewery_name }}" style="max-height: 80px; margin-bottom: 1.25rem;">
    <h1 class="font-viking text-gradient-gold" style="font-size: 2.2rem; margin-bottom: 0.8rem;">АРФА БРАГИ</h1>
    <p class="text-muted" style="margin-bottom: 2rem;">
      Если чертог игры не открылся на весь экран автоматически, нажми кнопку ниже:
    </p>
    <button class="btn btn-gold btn-lg btn-open-game-window" onclick="if(window.bragiGame){window.bragiGame.openGameModal();}else{location.reload();}" style="width: 100%;">
      ⚡ Открыть чертог игры
    </button>
  </div>
</section>
{% endblock %}

{% block scripts_extra %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    setTimeout(() => {
      if (window.bragiGame) {
        window.bragiGame.openGameModal();
      }
    }, 120);
  });
</script>
{% endblock %}
